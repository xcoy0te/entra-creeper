name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-22.04 still provides Python 3.7 via setup-python (24.04 does not).
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m py_compile entra-creeper.py
      - name: Run tests (stdlib unittest, offline)
        run: python -m unittest discover -s tests -v
